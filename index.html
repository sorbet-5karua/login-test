<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login (Firebase)</title>
</head>
<body>
  <h1>Firebase ログイン</h1>

  <p>メールアドレス：</p>
  <input id="email" type="email" placeholder="メールアドレスを入力">

  <p>パスワード：</p>
  <input id="pw" type="password" placeholder="パスワードを入力"
         onkeydown="if (event.key === 'Enter') { login(); }">

  <div style="margin-top: 12px;">
    <button onclick="login()">ログイン</button>
    <button onclick="signup()">新規登録</button>
  </div>

  <!-- Firebase を使ったログイン・新規登録処理 -->
  <script type="module">
    // ---------- Firebase SDK の読み込み ----------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // ---------- ★ここを自分の firebaseConfig に書き換える ----------
    const firebaseConfig = {
      apiKey: "AIzaSyAqTOtDrYmnSLk7sRW9qGLrwiM2ugS9-wk",
      authDomain: "login-test-firebase-3cea4.firebaseapp.com",
      projectId: "login-test-firebase-3cea4",
      storageBucket: "login-test-firebase-3cea4.firebasestorage.app",
      messagingSenderId: "22798270808",
      appId: "1:22798270808:web:bee1c64e4a60243c79e52d"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ---------- ログイン処理 ----------
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("pw").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // 成功したら home.html へ
        location.href = "home.html";
      } catch (error) {
        alert("ログイン失敗: " + error.message);
      }
    }

    // ---------- 新規ユーザー登録処理 ----------
    async function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("pw").value;

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("ユーザー登録が完了しました。続けてログインします。");
        location.href = "home.html";
      } catch (error) {
        alert("ユーザー登録失敗: " + error.message);
      }
    }

    // onclick から呼べるようにグローバルに出す
    window.login = login;
    window.signup = signup;
  </script>
</body>
</html>
