<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script>
    function login() {
      const id = document.getElementById("id").value;
      const pw = document.getElementById("pw").value;

      // テスト用の固定ID/PW
      const correctId = "testuser";
      const correctPw = "testpass";

      if (id === correctId && pw === correctPw) {
        location.href = "home.html";
      } else {
        alert("IDまたはパスワードが違います");
      }
    }
  </script>
</head>
<body>
  <h1>ログイン</h1>

  <input id="id" placeholder="ID を入力"><br><br>
  <input id="pw" type="password" placeholder="パスワードを入力"><br><br>

  <button onclick="login()">ログイン</button>
</body>
</html>
